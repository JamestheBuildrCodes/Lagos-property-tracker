name: Final Client Report Delivery

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reporting dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and email final client report
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_WEEKLY_REPORT_FOLDER_ID: "1pwAwektfnA52XkHzTIDkLGLHG0q_R1t3"
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_EMAIL: ${{ secrets.MAILJET_FROM_EMAIL }}
          MAILJET_FROM_NAME: ${{ secrets.MAILJET_FROM_NAME }}
          REPORT_CLIENT_EMAIL: ${{ secrets.REPORT_CLIENT_EMAIL }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          CURR=$(find data -maxdepth 1 -name 'property_listings_*.csv' -type f -print | sort | tail -n 1)
          RESEARCH=$(find data -maxdepth 1 -name 'estateintel_public_research_*.csv' -type f -print | sort | tail -n 1)
          CHANGES=$(find data -maxdepth 1 -name 'changes_*.csv' -type f -print | sort | tail -n 1)

          test -n "$CURR" || { echo "No committed property snapshot found."; exit 1; }
          test -s "$CURR"
          test -n "$GOOGLE_OAUTH_TOKEN_JSON" || { echo "GOOGLE_OAUTH_TOKEN_JSON is required."; exit 1; }
          test -n "$REPORT_CLIENT_EMAIL" || { echo "REPORT_CLIENT_EMAIL is required."; exit 1; }

          CURRENT="$CURR" python - <<'PY'
          import csv, os
          from datetime import date
          current = os.environ["CURRENT"]
          today = date.today().isoformat()
          with open(current, newline="", encoding="utf-8-sig") as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit("Committed snapshot is empty.")
          bad_date = [r.get("date_scraped") for r in rows if r.get("date_scraped") != today]
          bad_age = []
          for r in rows:
              try:
                  age = int(float(r.get("listing_age_days") or 0))
              except (TypeError, ValueError):
                  raise SystemExit(f"Invalid listing_age_days in {current}: {r.get('listing_age_days')!r}")
              if age < 0 or age > 7:
                  bad_age.append(age)
          if bad_date:
              raise SystemExit(f"Committed snapshot is not same-day: found date_scraped values {sorted(set(bad_date))}")
          if bad_age:
              raise SystemExit(f"Committed snapshot contains listing_age_days outside 0-7: {sorted(set(bad_age))[:10]}")
          print(f"Using same-day committed snapshot: {current} ({len(rows)} rows; max age 7 days)")
          PY

          python client_doc_report.py             "$CURR"             "${RESEARCH:-none}"             "${CHANGES:-none}"

          test -s Lagos_Property_Market_Snapshot_*.docx
          test -s client_doc_url.txt
          test -s mailjet_client-doc_receipt.json
          test -s google_doc_verification.json

          python - <<'PY'
          import json, glob
          receipt = json.load(open("mailjet_client-doc_receipt.json", encoding="utf-8"))
          statuses = [x.get("status") for x in receipt.get("message_results", [])]
          assert statuses and all(s == "success" for s in statuses), receipt
          print("Client email accepted by Mailjet with message-level success.")
          print("Google Doc:", open("client_doc_url.txt", encoding="utf-8").read().strip())
          PY

      - name: Upload final client deliverables
        uses: actions/upload-artifact@v4
        with:
          name: final-client-report
          path: |
            Lagos_Property_Market_Snapshot_*.docx
            client_doc_url.txt
            mailjet_client-doc_receipt.json
            google_doc_verification.json
          if-no-files-found: error
