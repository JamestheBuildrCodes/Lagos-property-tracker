name: Nigeria Property Market Scan

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".ops/live-scan-trigger"
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

concurrency:
  group: nigeria-property-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Build deterministic source manifest
        run: python discover_sources.py

      - name: Validate Python syntax
        run: python -m compileall -q *.py tests

      - name: Run architecture tests
        run: python -m unittest discover -s tests -v

      - name: Zyte connectivity preflight
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: python zyte_preflight.py

      - name: Collect current market data
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          ZYTE_BROWSER_HTML: "true"
          MAX_LISTING_AGE_DAYS: "7"
          PREFERRED_FRESHNESS_DAYS: "7"
          MIN_FRESH_LISTINGS_PER_CATEGORY: "6"
          MAX_PAGES_PER_CATEGORY: "3"
          MAX_LISTINGS_PER_CATEGORY: "24"
          MAX_DETAIL_FETCHES_PER_CATEGORY: "0"
          REQUEST_DELAY_SECONDS: "0.5"
          SCRAPER_WORKERS: "2"
          ZYTE_TIMEOUT_SECONDS: "90"
        run: python scraper.py

      - name: Verify core listing output
        shell: bash
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          test -s "$CURR"
          python - <<'PY'
          import csv, json, sys, glob
          current = sorted(glob.glob("property_listings_*.csv"))[-1]
          with open(current, newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          print(f"Core comparable listings: {len(rows)}")
          if not rows:
              report = json.load(open("scrape_run_report.json", encoding="utf-8"))
              print(json.dumps(report, indent=2))
              sys.exit("Core scraper produced zero comparable listings; stopping before report generation.")
          PY

      - name: Apply market data quality gate
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          test -s "$CURR"
          python quality_gate.py "$CURR"

      - name: Validate market output
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          test -s "$CURR"
          python validate_market_output.py "$CURR"
          python - <<'PY'
          import csv, glob, json, sys
          current = sorted(glob.glob("property_listings_*.csv"))[-1]
          with open(current, newline="", encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          print(f"Validated comparable listings: {len(rows)}")
          fresh = sum(1 for r in rows if r.get("freshness_band") == "0-7 days")
          print(f"Listings updated/added within 7 days: {fresh}")
          if not rows:
              print(json.dumps(json.load(open("scrape_run_report.json")), indent=2))
              sys.exit("Refusing to publish an empty report")
          PY

      - name: Detect weekly changes
        shell: bash
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          PREV=$(find data -maxdepth 1 -name 'property_listings_*.csv' -type f -print | sort | tail -n 1)
          if [ -n "$PREV" ] && [ "$PREV" != "$CURR" ]; then
            python detect_changes.py "$PREV" "$CURR"
          else
            echo "No previous property snapshot found; establishing baseline."
          fi

      - name: Build all three intelligence layers from one analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4.1-mini' }}
          OPENAI_REQUIRED: "true"
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          CHANGES=$(ls -t changes_*.csv 2>/dev/null | head -n 1)
          RESEARCH=$(ls -t estateintel_public_research_*.csv 2>/dev/null | head -n 1)
          python report_builder.py "$CURR" "${CHANGES:-none}" "${RESEARCH:-none}"
          test -s executive_brief_*.html
          test -s market_intelligence_*.xlsx
          test -s Lagos_Abuja_Property_Market_Intelligence_*.docx
          test -s market_intelligence.json

      - name: Write and verify Layer 2 in the existing Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          REPORT_CLIENT_EMAIL: ${{ secrets.REPORT_CLIENT_EMAIL }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "GOOGLE_SERVICE_ACCOUNT_JSON is required; refusing to send an incomplete report."; exit 1; }
          test -n "$GOOGLE_SHEET_ID" || { echo "GOOGLE_SHEET_ID is required; refusing to send an invalid Sheet link."; exit 1; }
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          CHANGES=$(ls -t changes_*.csv 2>/dev/null | head -n 1)
          RESEARCH=$(ls -t estateintel_public_research_*.csv 2>/dev/null | head -n 1)
          XLSX=$(ls -t market_intelligence_*.xlsx | head -n 1)
          python sheets_writer.py "$CURR" "${CHANGES:-none}" "${RESEARCH:-none}" "$XLSX"

      - name: Publish Layer 3 as Google Doc
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_CLIENT_EMAIL: ${{ secrets.REPORT_CLIENT_EMAIL }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            python docs_writer.py market_intelligence.json
            test -s google_doc_url.txt
          else
            echo "Google service account secret not configured; Google Doc publication skipped."
          fi

      - name: Publish client-preferred weekly document
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_WEEKLY_REPORT_FOLDER_ID: "1pwAwektfnA52XkHzTIDkLGLHG0q_R1t3"
          SUPPRESS_REPORT_NOTIFICATION_EMAIL: "1"
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          RESEARCH=$(ls -t estateintel_public_research_*.csv 2>/dev/null | head -n 1)
          CHANGES=$(ls -t changes_*.csv 2>/dev/null | head -n 1)
          test -s "$CURR"
          test -n "$GOOGLE_OAUTH_TOKEN_JSON" || { echo "GOOGLE_OAUTH_TOKEN_JSON is required for the client-preferred Google Doc."; exit 1; }
          test -n "$GOOGLE_WEEKLY_REPORT_FOLDER_ID" || { echo "GOOGLE_WEEKLY_REPORT_FOLDER_ID is required."; exit 1; }
          python client_doc_report.py "$CURR" "${RESEARCH:-none}" "${CHANGES:-none}"
          test -s Lagos_Property_Market_Snapshot_*.docx
          test -s client_doc_url.txt
          test -s google_doc_verification.json

      - name: Send final executive email with report links
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_EMAIL: ${{ secrets.MAILJET_FROM_EMAIL }}
          MAILJET_FROM_NAME: "Master Builder Inc."
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_CLIENT_EMAIL: ${{ secrets.REPORT_CLIENT_EMAIL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          test -n "$MAILJET_API_KEY" || { echo "MAILJET_API_KEY is required."; exit 1; }
          test -n "$MAILJET_SECRET_KEY" || { echo "MAILJET_SECRET_KEY is required."; exit 1; }
          test -n "$MAILJET_FROM_EMAIL" || { echo "MAILJET_FROM_EMAIL is required and must be approved in Mailjet."; exit 1; }
          test -n "$REPORT_CLIENT_EMAIL" || { echo "REPORT_CLIENT_EMAIL must be the client recipient."; exit 1; }
          test -n "$REPORT_TO_EMAIL" || { echo "REPORT_TO_EMAIL must contain the internal report recipient."; exit 1; }
          test -n "$GOOGLE_SHEET_ID" || { echo "GOOGLE_SHEET_ID is required for the report link."; exit 1; }
          python - <<'PY'
          import os
          from mailjet_sender import valid_email
          for key in ("MAILJET_FROM_EMAIL", "REPORT_CLIENT_EMAIL", "REPORT_TO_EMAIL"):
              if not valid_email(os.environ.get(key, "")):
                  raise SystemExit(f"{key} is missing or malformed; check the GitHub Actions secret.")
          print("Sender, client-recipient, and internal-copy email formats validated.")
          PY
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          CHANGES=$(ls -t changes_*.csv 2>/dev/null | head -n 1)
          HTML=$(ls -t executive_brief_*.html | head -n 1)
          DOC_URL=$(cat client_doc_url.txt)
          SHEET_URL="https://docs.google.com/spreadsheets/d/$GOOGLE_SHEET_ID/edit"
          python email_report.py "$CURR" "${CHANGES:-none}" "$REPORT_CLIENT_EMAIL" "$HTML" "$DOC_URL" "$SHEET_URL"

      - name: Verify Mailjet send receipts
        shell: bash
        run: |
          test -s mailjet_layer1_receipt.json
          python - <<'PY'
          import json
          for path in ("mailjet_layer1_receipt.json",):
              data = json.load(open(path, encoding="utf-8"))
              statuses = [
                  result.get("status")
                  for result in data.get("message_results", [])
              ]
              assert statuses and all(status == "success" for status in statuses), (
                  f"Mailjet receipt is not fully successful: {path}"
              )
              print(
                  f"{path}: HTTP {data.get('http_status')}; "
                  f"status=success; CustomID={data.get('custom_id')}"
              )
          PY

      - name: Archive intelligence outputs
        run: |
          mkdir -p data
          mv property_listings_*.csv data/
          mv estateintel_public_research_*.csv data/ 2>/dev/null || true
          mv changes_*.csv data/ 2>/dev/null || true
          mv market_intelligence_*.xlsx data/ 2>/dev/null || true
          mv Lagos_Abuja_Property_Market_Intelligence_*.docx data/ 2>/dev/null || true
          mv Lagos_Property_Market_Snapshot_*.docx data/ 2>/dev/null || true
          mv executive_brief_*.html data/ 2>/dev/null || true
          cp scrape_run_report.json data/
          cp market_output_validation.json data/
          cp market_output_quality.json data/ 2>/dev/null || true
          cp market_intelligence.json data/
          cp report_outputs.json data/
          cp google_doc_url.txt data/ 2>/dev/null || true
          cp client_doc_url.txt data/ 2>/dev/null || true
          cp google_doc_verification.json data/ 2>/dev/null || true
          mv mailjet_*_receipt.json data/ 2>/dev/null || true

      - name: Commit results
        run: |
          git config user.name "property-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ tests/ discover_sources.py scraper.py market_analysis.py report_builder.py sheets_writer.py email_report.py docs_writer.py client_doc_report.py mailjet_sender.py validate_market_output.py requirements.txt .github/workflows/weekly-scan.yml .github/workflows/email-delivery-diagnostic.yml mailjet_delivery_diagnostic.py
          git commit -m "Property market snapshot $(date -u +%Y-%m-%d)" || echo "Nothing to commit"

      - name: Rebase and push results safely
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 3
          done
          exit 1

      - name: Alert internal owner if the scan failed before report delivery
        if: failure() && !cancelled()
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_EMAIL: ${{ secrets.MAILJET_FROM_EMAIL }}
          MAILJET_FROM_NAME: "Master Builder Inc."
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: python workflow_failure_alert.py
