name: Sanitize Public Mailjet Receipts

on:
  push:
    paths:
      - "data/mailjet_*_receipt.json"

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Redact recipient addresses
        run: python sanitize_public_receipts.py
      - name: Commit sanitized receipts when needed
        run: |
          if git diff --quiet -- data/mailjet_*_receipt.json; then
            echo "Receipts are already sanitized."
            exit 0
          fi
          git config user.name "property-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mailjet_*_receipt.json
          git commit -m "Redact recipient addresses from public Mailjet receipts"
          git push origin HEAD:main
