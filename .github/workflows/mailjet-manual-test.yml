name: Mailjet Manual Test Email

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "Test email address (use an address that is not blocked by Mailjet)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Send verification email
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_EMAIL: ${{ secrets.MAILJET_FROM_EMAIL }}
          MAILJET_FROM_NAME: ${{ secrets.MAILJET_FROM_NAME }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python mailjet_test_send.py "${{ inputs.recipient }}"
