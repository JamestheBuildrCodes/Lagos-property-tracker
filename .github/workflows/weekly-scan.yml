name: Nigeria Property Market Scan

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

concurrency:
  group: nigeria-property-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Build deterministic source manifest
        run: python discover_sources.py

      - name: Run architecture tests
        run: python -m unittest discover -s tests -v

      - name: Zyte connectivity preflight
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: python zyte_preflight.py

      - name: Collect current market data
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          ZYTE_BROWSER_HTML: "true"
          MAX_LISTING_AGE_DAYS: "31"
          MAX_PAGES_PER_CATEGORY: "1"
          MAX_LISTINGS_PER_CATEGORY: "12"
          MAX_DETAIL_FETCHES_PER_CATEGORY: "0"
          REQUEST_DELAY_SECONDS: "0.5"
          SCRAPER_WORKERS: "2"
          ZYTE_TIMEOUT_SECONDS: "90"
        run: python scraper.py

      - name: Apply market data quality gate
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          test -s "$CURR"
          python quality_gate.py "$CURR"

      - name: Validate market output
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          test -s "$CURR"
          python validate_market_output.py "$CURR"
          python - <<'PY'
          import csv, glob, json, sys
          current = sorted(glob.glob("property_listings_*.csv"))[-1]
          with open(current, newline="", encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          print(f"Validated comparable listings: {len(rows)}")
          if not rows:
              print(json.dumps(json.load(open("scrape_run_report.json")), indent=2))
              sys.exit("Refusing to publish an empty report")
          PY

      - name: Detect weekly changes
        shell: bash
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          PREV=$(find data -maxdepth 1 -name 'property_listings_*.csv' -type f -print | sort | tail -n 1)
          if [ -n "$PREV" ] && [ "$PREV" != "$CURR" ]; then
            python detect_changes.py "$PREV" "$CURR"
          else
            echo "No previous property snapshot found; establishing baseline."
          fi

      - name: Build all three intelligence layers from one analysis
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          CHANGES=$(ls -t changes_*.csv 2>/dev/null | head -n 1)
          RESEARCH=$(ls -t estateintel_public_research_*.csv 2>/dev/null | head -n 1)
          python report_builder.py "$CURR" "${CHANGES:-none}" "${RESEARCH:-none}"
          test -s executive_brief_*.html
          test -s market_intelligence_*.xlsx
          test -s Lagos_Abuja_Property_Market_Intelligence_*.docx
          test -s market_intelligence.json

      - name: Send Layer 1 executive email
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_EMAIL: ${{ secrets.MAILJET_FROM_EMAIL }}
          MAILJET_FROM_NAME: ${{ secrets.MAILJET_FROM_NAME }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_CLIENT_EMAIL: ${{ secrets.REPORT_CLIENT_EMAIL }}
        run: |
          if [ -n "$MAILJET_API_KEY" ] && [ -n "$MAILJET_SECRET_KEY" ] && [ -n "$REPORT_CLIENT_EMAIL" ]; then
            test -n "$MAILJET_FROM_EMAIL" || { echo "MAILJET_FROM_EMAIL is not configured; use an active Mailjet sender address."; exit 1; }
            CURR=$(ls -t property_listings_*.csv | head -n 1)
            CHANGES=$(ls -t changes_*.csv 2>/dev/null | head -n 1)
            HTML=$(ls -t executive_brief_*.html | head -n 1)
            python email_report.py "$CURR" "${CHANGES:-none}" "$REPORT_CLIENT_EMAIL" "$HTML"
          else
            echo "Mailjet secrets not configured; Layer 1 email skipped."
          fi

      - name: Write Layer 2 to existing Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          REPORT_CLIENT_EMAIL: ${{ secrets.REPORT_CLIENT_EMAIL }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && [ -n "$GOOGLE_SHEET_ID" ]; then
            CURR=$(ls -t property_listings_*.csv | head -n 1)
            CHANGES=$(ls -t changes_*.csv 2>/dev/null | head -n 1)
            RESEARCH=$(ls -t estateintel_public_research_*.csv 2>/dev/null | head -n 1)
            XLSX=$(ls -t market_intelligence_*.xlsx | head -n 1)
            python sheets_writer.py "$CURR" "${CHANGES:-none}" "${RESEARCH:-none}" "$XLSX"
          else
            echo "Google Sheets secrets not configured; Layer 2 mirror skipped."
          fi

      - name: Publish Layer 3 as Google Doc
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_CLIENT_EMAIL: ${{ secrets.REPORT_CLIENT_EMAIL }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            python docs_writer.py market_intelligence.json
            test -s google_doc_url.txt
          else
            echo "Google service account secret not configured; Google Doc publication skipped."
          fi

      - name: Fix client document creation for service-account storage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("client_doc_report.py")
          s = p.read_text(encoding="utf-8")
          old = '''    doc = docs.documents().create(body={"title": title}).execute()\n    doc_id = doc["documentId"]'''
          new = '''    # GitHub Actions service accounts are not guaranteed to have their own\n    # consumer Drive storage/quota. Use the existing shared Google Doc as a\n    # template and copy it through Drive, then clear the copy before filling\n    # the new weekly report. This preserves the client's requested\n    # "new document every week" behavior without calling Docs create().\n    template_id = os.environ.get("GOOGLE_DOC_ID", "").strip()\n    if not template_id:\n        raise RuntimeError(\n            "GOOGLE_DOC_ID is required as an accessible Google Doc template "\n            "for the weekly client report."\n        )\n    copied = drive.files().copy(\n        fileId=template_id,\n        body={"name": title},\n        supportsAllDrives=True,\n        fields="id",\n    ).execute()\n    doc_id = copied["id"]\n\n    # The template may contain the previous report. Clear its body while\n    # preserving the final required document newline, then write this run.\n    existing = docs.documents().get(documentId=doc_id).execute()\n    body = existing.get("body", {}).get("content", [])\n    end = max((el.get("endIndex", 1) for el in body), default=1) - 1\n    if end > 1:\n        docs.documents().batchUpdate(\n            documentId=doc_id,\n            body={"requests": [{\n                "deleteContentRange": {"range": {"startIndex": 1, "endIndex": end}}\n            }]}\n        ).execute()'''
          if old not in s:
              raise SystemExit("Expected client_doc_report.py create() block was not found; refusing to modify the file.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("Patched client_doc_report.py to copy GOOGLE_DOC_ID as a template.")
          PY

      - name: Create and email a new client-preferred weekly document
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_EMAIL: ${{ secrets.MAILJET_FROM_EMAIL }}
          MAILJET_FROM_NAME: ${{ secrets.MAILJET_FROM_NAME }}
          REPORT_CLIENT_EMAIL: ${{ secrets.REPORT_CLIENT_EMAIL }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
        run: |
          CURR=$(ls -t property_listings_*.csv | head -n 1)
          test -s "$CURR"
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "GOOGLE_SERVICE_ACCOUNT_JSON is required for the client-preferred Google Doc."; exit 1; }
          test -n "$GOOGLE_DOC_ID" || { echo "GOOGLE_DOC_ID must point to the accessible Google Doc template."; exit 1; }
          python client_doc_report.py "$CURR"
          test -s Lagos_Property_Market_Snapshot_*.docx
          test -s client_doc_url.txt

      - name: Archive intelligence outputs
        run: |
          mkdir -p data
          mv property_listings_*.csv data/
          mv estateintel_public_research_*.csv data/ 2>/dev/null || true
          mv changes_*.csv data/ 2>/dev/null || true
          mv market_intelligence_*.xlsx data/ 2>/dev/null || true
          mv Lagos_Abuja_Property_Market_Intelligence_*.docx data/ 2>/dev/null || true
          mv Lagos_Property_Market_Snapshot_*.docx data/ 2>/dev/null || true
          mv executive_brief_*.html data/ 2>/dev/null || true
          cp scrape_run_report.json data/
          cp market_output_validation.json data/
          cp market_output_quality.json data/ 2>/dev/null || true
          cp market_intelligence.json data/
          cp report_outputs.json data/
          cp google_doc_url.txt data/ 2>/dev/null || true
          cp client_doc_url.txt data/ 2>/dev/null || true

      - name: Commit results
        run: |
          git config user.name "property-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ tests/ discover_sources.py scraper.py market_analysis.py report_builder.py sheets_writer.py email_report.py docs_writer.py client_doc_report.py validate_market_output.py requirements.txt .github/workflows/weekly-scan.yml
          git commit -m "Property market snapshot $(date -u +%Y-%m-%d)" || echo "Nothing to commit"

      - name: Rebase and push results safely
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 3
          done
          exit 1
