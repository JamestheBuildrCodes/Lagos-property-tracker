name: Google OAuth and Docs Live Preflight

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".ops/google-oauth-preflight-trigger"
      - "google_oauth_preflight.py"
      - ".github/workflows/google-oauth-preflight.yml"

permissions:
  contents: read

jobs:
  oauth-docs-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Google API dependencies
        run: python -m pip install "google-auth>=2.35,<3" "google-api-python-client>=2.150,<3"
      - name: Refresh OAuth and test Google Docs create/write/read/delete
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_WEEKLY_REPORT_FOLDER_ID: "1pwAwektfnA52XkHzTIDkLGLHG0q_R1t3"
        run: python google_oauth_preflight.py
