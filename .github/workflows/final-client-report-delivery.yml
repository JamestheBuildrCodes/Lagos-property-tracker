name: Final Client Report Delivery

on:
  workflow_dispatch: {}
permissions:
  contents: read

# Code pushes during a repair can otherwise start several identical client sends.
# Keep only the newest report-delivery run active.
concurrency:
  group: final-client-report-delivery
  cancel-in-progress: true

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reporting dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and email final client report
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WEEKLY_REPORT_FOLDER_ID: "1pwAwektfnA52XkHzTIDkLGLHG0q_R1t3"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "qwen/qwen3.8-27b"
          GROQ_AI_COMMENTARY_ENABLED: "true"
          GROQ_AI_COMMENTARY_REQUIRED: "true"
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_EMAIL: ${{ secrets.MAILJET_FROM_EMAIL }}
          MAILJET_FROM_NAME: ${{ secrets.MAILJET_FROM_NAME }}
          REPORT_CLIENT_EMAIL: ${{ secrets.REPORT_CLIENT_EMAIL }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          SUPPRESS_REPORT_NOTIFICATION_EMAIL: "1"
          DEFER_DOCX_EMAIL: "1"
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          CURR=$(find data -maxdepth 1 -name 'property_listings_*.csv' -type f -print | sort | tail -n 1)
          RESEARCH=$(find data -maxdepth 1 -name 'estateintel_public_research_*.csv' -type f -print | sort | tail -n 1)
          CHANGES=$(find data -maxdepth 1 -name 'changes_*.csv' -type f -print | sort | tail -n 1)

          test -n "$CURR" || { echo "No committed property snapshot found."; exit 1; }
          test -s "$CURR"
          test -n "$REPORT_CLIENT_EMAIL" || { echo "REPORT_CLIENT_EMAIL is required."; exit 1; }

          CURRENT="$CURR" python - <<'PY'
          import csv, os
          from datetime import datetime, date
          from zoneinfo import ZoneInfo

          current = os.environ["CURRENT"]
          today = datetime.now(ZoneInfo("Africa/Lagos")).date()
          with open(current, newline="", encoding="utf-8-sig") as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit("Committed snapshot is empty.")

          scraped_dates = sorted({(r.get("date_scraped") or "").strip() for r in rows})
          if len(scraped_dates) != 1 or not scraped_dates[0]:
              raise SystemExit(f"Snapshot must have exactly one non-empty date_scraped value; found {scraped_dates}")

          try:
              snapshot_date = date.fromisoformat(scraped_dates[0])
          except ValueError:
              raise SystemExit(f"Invalid date_scraped in {current}: {scraped_dates[0]!r}")

          age_days = (today - snapshot_date).days
          if age_days < 0 or age_days > 1:
              raise SystemExit(
                  f"Snapshot is {age_days} days old (date_scraped={snapshot_date}); "
                  "final client delivery permits only today's or yesterday's snapshot. "
                  "Run the live scan to refresh older data."
              )

          bad_age = []
          for r in rows:
              try:
                  age = int(float(r.get("listing_age_days") or 0))
              except (TypeError, ValueError):
                  raise SystemExit(f"Invalid listing_age_days in {current}: {r.get('listing_age_days')!r}")
              if age < 0 or age > 7:
                  bad_age.append(age)
          if bad_age:
              raise SystemExit(f"Snapshot contains listing_age_days outside 0-7: {sorted(set(bad_age))[:10]}")

          if age_days == 1:
              print(f"WARNING: live scan snapshot is from {snapshot_date}, one day old. Report must retain the source/as-of date and must not imply today's listings were freshly scraped.")
          print(f"Validated snapshot: {current} ({len(rows)} rows; source date {snapshot_date}; listing age max 7 days)")
          PY

          # Rebuild the spreadsheet and executive brief with the same deterministic,
          # annualized-rent and source-quality rules as the final Word report.
          python report_builder.py "$CURR" "${CHANGES:-none}" "${RESEARCH:-none}"
          XLSX=$(ls -t market_intelligence_*.xlsx | head -n 1)
          test -n "$XLSX" && test -s "$XLSX"
          test -s market_intelligence.json
          python - <<'PY'
          import json
          data = json.load(open("market_intelligence.json", encoding="utf-8"))
          ai = data.get("summary", {}).get("ai_commentary") or {}
          if not ai.get("executive_takeaway") or not ai.get("key_findings") or not ai.get("recommended_actions"):
              raise SystemExit("Required AI market interpretation is missing or incomplete.")
          print("Required AI interpretation is embedded in the report data.")
          PY
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "GOOGLE_SERVICE_ACCOUNT_JSON is required."; exit 1; }
          test -n "$GOOGLE_SHEET_ID" || { echo "GOOGLE_SHEET_ID is required."; exit 1; }
          XLSX=$(ls -t market_intelligence_*.xlsx | head -n 1)
          python sheets_writer.py "$CURR" "${CHANGES:-none}" "${RESEARCH:-none}" "$XLSX"
          XLSX="$XLSX" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          json.dump({"status":"success","workbook":os.environ["XLSX"],"updated_at_utc":datetime.now(timezone.utc).isoformat()}, open("google_sheet_update_status.json","w",encoding="utf-8"), indent=2)
          PY
          # OAuth is the primary human-owned Drive route. Prepare the verified
          # service-account document only as fallback if OAuth publication fails.
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            if GOOGLE_CREATE_WEEKLY_DOC="true" python docs_writer.py market_intelligence.json; then
              echo "Verified service-account Google Doc fallback is ready."
            else
              echo "::warning::Service-account fallback unavailable; OAuth publication must succeed."
              rm -f google_doc_url.txt google_doc_publication.json
            fi
          fi
          python client_doc_report.py "$CURR" "${RESEARCH:-none}" "${CHANGES:-none}"
          python - <<'PY'
          import json
          v=json.load(open("google_doc_verification.json",encoding="utf-8"))
          assert v.get("content_verified") is True and v.get("ai_commentary_verified") is True and v.get("client_access_granted") is True, v
          assert v.get("publication_status") != "docx_attachment_fallback_no_google_doc", v
          print("Final client document verified before email delivery.")
          PY
          DOCX=$(ls -t Lagos_Property_Market_Snapshot_*.docx | head -n 1)
          test -n "$DOCX" && test -s "$DOCX"
          python enhance_client_report.py "$CURR" "$DOCX"
          test -s client_report_quality_audit.json
          python email_client_docx.py "$DOCX"
          test -s client_doc_url.txt
          test -s mailjet_client_docx_receipt.json
          test -s google_doc_verification.json

          python - <<'PY'
          import json
          receipt = json.load(open("mailjet_client_docx_receipt.json", encoding="utf-8"))
          statuses = [x.get("status") for x in receipt.get("message_results", [])]
          assert statuses and all(s == "success" for s in statuses), receipt
          print("Final enhanced DOCX accepted by Mailjet with message-level success.")
          verification = json.load(open("google_doc_verification.json", encoding="utf-8"))
          status = verification.get("publication_status", "")
          assert status != "docx_attachment_fallback_no_google_doc", verification
          assert verification.get("content_verified") and verification.get("ai_commentary_verified") and verification.get("client_access_granted"), verification
          print("Verified Google Doc publication:", status)
          print("The live Google Sheet and verified Google Doc accompany the enhanced Word report.")
          PY

      - name: Upload final client deliverables
        uses: actions/upload-artifact@v4
        with:
          name: final-client-report
          path: |
            Lagos_Property_Market_Snapshot_*.docx
            market_intelligence_*.xlsx
            executive_brief_*.html
            market_intelligence.json
            google_sheet_update_status.json
            client_doc_url.txt
            mailjet_client_docx_receipt.json
            client_report_quality_audit.json
            market_output_quality.json
            market_output_review.csv
            google_doc_verification.json
          if-no-files-found: error
