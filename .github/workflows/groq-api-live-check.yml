name: Groq API Live Check

on:
  push:
    paths:
      - ".ops/groq-preflight-trigger"

permissions:
  contents: read

jobs:
  verify-groq:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP dependency
        run: python -m pip install requests
      - name: Verify Groq API and JSON-mode model response
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "qwen/qwen3.8-27b"
        run: python groq_preflight.py
